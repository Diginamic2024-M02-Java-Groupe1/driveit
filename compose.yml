services:
  database:
    container_name: driveit-database
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MARIADB_DATABASE}"
      MYSQL_USER: "${MARIADB_USER}"
      MYSQL_PASSWORD: "${MARIADB_PASSWORD}"
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql

  phpmyadmin:
    container_name: driveit-phpmyadmin
    image: phpmyadmin:latest
    restart: always
    links:
      - database
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - ${PHPMYADMIN_PORT}:80

  api:
    container_name: driveit-api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - database
    environment:
      SPRING_SERVER_PORT: ${API_PORT}
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/${MARIADB_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MariaDBDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: ${API_PORT}
      SERVER_ADDRESS: 0.0.0.0
      CLIENT_URL: http://localhost
    ports:
      - "${API_PORT}:8080"
    develop:
      watch:
        - action: rebuild
          path: ./api
          ignore:
            - ./api/target
            - ./api/.git

  app:
    container_name: driveit-app
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
      - database
    ports:
      - "${APP_PORT}:80"
    develop:
      watch:
        - action: rebuild
          path: ./app
          ignore:
            - ./app/node_modules
            - ./app/dist
            - ./app/.git

volumes:
  db-data:
    name: driveit-db-data